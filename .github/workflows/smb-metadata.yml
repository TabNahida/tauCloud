name: SMB metadata compatibility
on:
  push:
    paths:
      - '.github/workflows/smb-metadata.yml'
      - 'src/smb.cpp'
      - 'src/smb_crypto.cpp'
      - 'src/smb3.cpp'
      - 'include/taucloud/smb.hpp'
      - 'src/identity.cpp'
      - 'src/ipc.cpp'
      - 'src/api.cpp'
      - 'tests/smb_gss_integration.py'
      - 'tests/smb_reauthentication.py'
      - 'tests/linux_native_smb_gss.py'
      - 'src/smb_async.inc'
      - 'tests/smb_blocking_locks.py'
      - 'tests/samba-profile.json'
      - 'src/file_smb.inc'
      - 'src/files.cpp'
      - 'src/security.cpp'
      - 'src/file_security.inc'
      - 'include/taucloud/security.hpp'
      - 'src/policy.cpp'
      - 'src/file_nfs.inc'
      - 'src/file_nfs_security.inc'
      - 'tests/nfs_acl_integration.py'
      - 'tests/nfs_mode_integration.py'
      - 'src/file_dav.inc'
      - 'tests/smb_security_integration.py'
      - 'tests/windows_native_smb.py'
      - 'src/native_files.cpp'
      - 'include/taucloud/files.hpp'
      - 'tests/smb_attributes_integration.py'
      - 'tests/smb_allocation_integration.py'
      - 'tests/m6_integration.py'
      - 'tests/m2_core.cpp'
      - 'tests/m5_core.cpp'
      - 'tests/m7_core.cpp'
      - 'src/nfs_protocol.cpp'
      - 'src/nfs.cpp'
      - 'src/nfs_gss.inc'
      - 'src/gss.cpp'
      - 'include/taucloud/gss.hpp'
      - 'include/taucloud/core.hpp'
      - 'src/core.cpp'
      - 'xmake.lua'
      - 'tests/nfs_gss_integration.py'
      - 'tests/nfs_discovery_integration.py'
      - 'tests/linux_native_gss.py'
      - 'tests/kerberos-requirements.txt'
      - 'src/nfs_v4.inc'
      - 'tests/nfs_attributes_integration.py'
      - 'tests/native_allocation.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    name: ${{ matrix.compiler }} metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, compiler: gcc, platform: linux, arch: x86_64, mode: release, sanitizers: 'n', suffix: '', test_options: '', blocking_options: '--idle'}
          - {runner: ubuntu-24.04, compiler: clang, platform: linux, arch: x86_64, mode: debug, sanitizers: 'y', suffix: '', test_options: '--sanitizers', blocking_options: ''}
          - {runner: windows-2025, compiler: msvc, platform: windows, arch: x64, mode: release, sanitizers: 'n', suffix: '.exe', test_options: '', blocking_options: ''}
    env:
      PYTHONUTF8: '1'
      PIP_BREAK_SYSTEM_PACKAGES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'
      - run: python scripts/fetch_pace.py
      - run: python scripts/fetch_pace.py --dependency recipes
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libssl-dev libexpat1-dev samba-testsuite smbclient cifs-utils keyutils libkrb5-dev krb5-kdc krb5-admin-server krb5-user nfs-common
      - run: python -m pip install -r tests/smb-requirements.txt -r tests/nfs-requirements.txt
      - if: runner.os == 'Linux'
        run: python -m pip install -r tests/kerberos-requirements.txt
      - run: python scripts/fetch_nfs_client.py
      - run: xmake f -y -c -p ${{ matrix.platform }} -a ${{ matrix.arch }} -m ${{ matrix.mode }} --m0=n --m1=y --toolchain=${{ matrix.compiler }} --sanitizers=${{ matrix.sanitizers }}
      - run: xmake -y -j 8
      - name: Native allocation failure safety
        run: ./build/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.mode }}/taucloud_m2_tests${{ matrix.suffix }}
      - name: SMB authority and failed CREATE cleanup
        run: ./build/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.mode }}/taucloud_m5_tests${{ matrix.suffix }}
      - name: SMB session renewal and failure cleanup
        run: python tests/smb_reauthentication.py --bin build/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.mode }} ${{ matrix.test_options }} --output build/acceptance/smb-reauth.json
      - name: Persistent ACLs and cross-protocol permission checks
        run: python tests/smb_security_integration.py --bin build/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.mode }} --output build/acceptance/security.json
      - name: Native Windows security descriptor operations
        if: runner.os == 'Windows'
        run: python tests/windows_native_smb.py --bin build/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.mode }} --output build/acceptance/windows-native-security.json
      - name: Unmodified Samba ACL conformance
        if: runner.os == 'Linux'
        run: python tests/samba_torture.py --bin build/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.mode }} --output build/acceptance/samba-acls.json smb2.acls.CREATOR smb2.acls.GENERIC smb2.acls.OWNER smb2.acls.INHERITANCE smb2.acls.INHERITFLAGS smb2.acls.DYNAMIC smb2.acls.ACCESSBASED smb2.acls.OWNER-RIGHTS smb2.acls.OWNER-RIGHTS-DENY smb2.acls.OWNER-RIGHTS-DENY1 smb2.acls.DENY1 smb2.acls.MXAC-NOT-GRANTED smb2.acls.OVERWRITE_READ_ONLY_FILE
      - name: DOS metadata, timestamps, EAs and modes
        run: python tests/smb_attributes_integration.py --bin build/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.mode }} --output build/acceptance/metadata.json
      - name: Asynchronous SMB blocking locks and cancellation
        run: python tests/smb_blocking_locks.py --bin build/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.mode }} ${{ matrix.blocking_options }} --output build/acceptance/blocking-locks.json
      - name: Unmodified Samba asynchronous locks
        if: runner.os == 'Linux'
        run: python tests/samba_torture.py --bin build/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.mode }} --output build/acceptance/samba-async.json smb2.lock.async smb2.lock.cancel smb2.lock.cancel-tdis smb2.lock.cancel-logoff
      - name: Native allocation and durable quota
        run: python tests/smb_allocation_integration.py --bin build/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.mode }} --output build/acceptance/allocation.json
      - name: NFS attributes and native allocation
        run: python tests/nfs_attributes_integration.py --bin build/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.mode }} ${{ matrix.test_options }} --output build/acceptance/nfs-attributes.json
      - name: NFS file authority and security discovery isolation
        run: ./build/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.mode }}/taucloud_m7_tests${{ matrix.suffix }}
      - name: NFS anonymous security discovery and revocation
        run: python tests/nfs_discovery_integration.py --bin build/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.mode }} ${{ matrix.test_options }} --output build/acceptance/nfs-discovery.json
      - name: NFSv4 ACLs, mode and cross-protocol access
        run: python tests/nfs_acl_integration.py --bin build/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.mode }} ${{ matrix.test_options }} --output build/acceptance/nfs-acl.json
      - name: NFS special modes and shared namespace permissions
        run: python tests/nfs_mode_integration.py --bin build/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.mode }} ${{ matrix.test_options }} --output build/acceptance/nfs-mode.json
      - name: NFS RPCSEC_GSS with real MIT KDC and client
        if: runner.os == 'Linux'
        run: |
          python scripts/prepare_pynfs.py
          python tests/nfs_gss_integration.py --bin build/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.mode }} ${{ matrix.test_options }} ${{ matrix.compiler == 'gcc' && '--native' || '' }} --pynfs build/pynfs/nfs4.1 --output build/acceptance/nfs-gss.json
      - name: SMB3 dialects and encrypted allocation
        run: python tests/m6_integration.py --bin build/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.mode }} --large-mib 1 ${{ matrix.test_options }} --output build/acceptance/smb3.json
      - name: SMB Kerberos, SPNEGO and native Linux CIFS
        if: runner.os == 'Linux'
        run: python tests/smb_gss_integration.py --bin build/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.mode }} ${{ matrix.test_options }} --smbclient smbclient ${{ matrix.compiler == 'gcc' && '--native' || '' }} --output build/acceptance/smb-gss.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smb-metadata-${{ matrix.compiler }}
          path: |
            build/acceptance/*.json
            build/acceptance/samba-*.log
            build/acceptance/nfs-gss.*.log
            build/acceptance/smb-gss.*.log
