name: Backend pre-M8 acceptance
on:
  push:
    paths-ignore: ['docs/**', 'TODO.md']
  pull_request:
    paths-ignore: ['docs/**', 'TODO.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'
      - run: python3 scripts/fetch_pace.py
      - run: python3 scripts/fetch_pace.py --dependency recipes
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libexpat1-dev
      - run: python3 scripts/fetch_litmus.py
      - run: python3 -m pip install --break-system-packages -r tests/smb-requirements.txt -r tests/nfs-requirements.txt
      - run: python3 scripts/run_m7.py --compiler ${{ matrix.compiler }} ${{ matrix.compiler == 'clang' && '--mode debug --sanitizers' || '' }} --litmus build/litmus/installed/bin/litmus
      - name: Independent native clients
        if: always() && matrix.compiler == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y cifs-utils nfs-common smbclient
          python3 tests/native_clients.py --bin build/linux/x86_64/release --output build/acceptance/native-linux.json --profiles smbclient-2.1 smbclient-3.1.1 kernel-nfs-3 kernel-nfs-4.1 kernel-nfs-4.1-root
      - name: Kernel CIFS missing-MIC rejection (not compatibility)
        if: always() && matrix.compiler == 'gcc'
        run: python3 tests/native_clients.py --bin build/linux/x86_64/release --output build/acceptance/kernel-cifs-rejection.json --profiles kernel-cifs-2.1 kernel-cifs-3.0 kernel-cifs-3.02 kernel-cifs-3.1.1 --require-mic-rejection
      - name: Unmodified FileZilla GUI FTPS upload and download
        if: always() && matrix.compiler == 'gcc'
        run: |
          sudo apt-get install -y filezilla xvfb xdotool
          python3 -m pip install --break-system-packages pillow
          python3 tests/filezilla_acceptance.py --bin build/linux/x86_64/release --output build/acceptance/filezilla-linux.json
      - name: Upstream pynfs client
        if: always() && matrix.compiler == 'gcc'
        run: |
          python3 scripts/prepare_pynfs.py
          python3 tests/pynfs_acceptance.py --bin build/linux/x86_64/release --output build/acceptance/pynfs.json OPEN1 OPEN2 OPEN6 OPEN7 OPEN8 OPEN30 OPEN31 CSID1 CSID2 CSID3 CSID4 CSID5 CSID6 CSID8 CSID9 CSID10 sequence reclaim_complete
      - name: Upstream NFS session and client lifecycle
        if: always() && matrix.compiler == 'gcc'
        run: python3 tests/pynfs_acceptance.py --bin build/linux/x86_64/release --output build/acceptance/pynfs-control.json SECNN3 SECNN4 DESCID7 DSESS9005 DSESS9004 DSESS9001 CSESS23 CSESS5a CSESS5b CSESS26 CSESS9 CSESS10 CSESS29 CSESS16 CSESS16a CSESS15 COMP5 COMP3 EID6 EID6a EID6b EID6c EID6d EID6e EID6f EID6g EID7 EID8 EID5d EID5e EID5f EID5fb EID9 EID4
      - name: NFS competing clients and restart recovery
        if: always() && matrix.compiler == 'gcc'
        run: python3 tests/nfs_state_integration.py --bin build/linux/x86_64/release --output build/acceptance/nfs-state.json
      - name: Upstream regular-file and directory namespace
        if: always() && matrix.compiler == 'gcc'
        run: python3 tests/pynfs_acceptance.py --bin build/linux/x86_64/release --output build/acceptance/pynfs-namespace.json LKPP1r LKPP1d LKPP2 LKPP3 PUTFH1r PUTFH1d PUTFH2 RNM1d RNM1r RNM2r RNM3r RNM4 RNM5 RNM6 RNM7 RNM8 RNM9 RNM10 RNM11 RNM12 RNM13 RNM14 RNM15 RNM16 RNM17 RNM18 RNM19 SEC1 SEC2 VF1r
      - name: NFS native attributes and aliases
        if: always() && matrix.compiler == 'gcc'
        run: python3 tests/nfs_attributes_integration.py --bin build/linux/x86_64/release --output build/acceptance/nfs-attributes.json
      - name: NFS creation attributes and safe truncation
        if: always() && matrix.compiler == 'gcc'
        run: python3 tests/nfs_create_integration.py --bin build/linux/x86_64/release --output build/acceptance/nfs-create.json
      - name: Package the same Linux server for macOS native-client tests
        if: always() && matrix.compiler == 'gcc'
        run: tar czf build/linux-server.tgz -C build/linux/x86_64/release .
      - uses: actions/upload-artifact@v4
        if: always() && matrix.compiler == 'gcc'
        with:
          name: linux-server
          path: build/linux-server.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.compiler }}
          path: |
            build/m7/*.json
            build/acceptance/*
  macos-clients:
    needs: linux
    if: always()
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-server
          path: build
      - run: brew install qemu
      - name: macOS native SMB and NFSv3 against isolated Linux guest
        run: |
          python3 -m venv build/mac-tools
          build/mac-tools/bin/pip install argon2-cffi
          build/mac-tools/bin/python scripts/run_macos_clients.py --archive build/linux-server.tgz --output build/acceptance/macos-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-native
          path: build/acceptance/*
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'
      - run: python scripts/fetch_pace.py
      - run: python scripts/fetch_pace.py --dependency recipes
      - run: python -m pip install -r tests/smb-requirements.txt -r tests/nfs-requirements.txt
      - run: python scripts/run_m7.py --compiler msvc
        env:
          PYTHONUTF8: '1'
      - name: NFS competing clients and restart recovery
        run: python tests/nfs_state_integration.py --bin build/windows/x64/release --output build/acceptance/nfs-state.json
      - name: NFS native attributes and aliases
        run: python tests/nfs_attributes_integration.py --bin build/windows/x64/release --output build/acceptance/nfs-attributes.json
      - name: NFS creation attributes and safe truncation
        run: python tests/nfs_create_integration.py --bin build/windows/x64/release --output build/acceptance/nfs-create.json
      - name: Windows native SMB redirector (signed and encrypted)
        if: always()
        run: python tests/windows_native_smb.py --bin build/windows/x64/release --output build/acceptance/windows-native-smb.json
      - name: Unmodified FileZilla GUI FTPS upload and download
        if: always()
        run: |
          choco install filezilla --no-progress -y
          python -m pip install pywinauto pillow
          python tests/filezilla_acceptance.py --bin build/windows/x64/release --filezilla "C:\Program Files\FileZilla FTP Client\filezilla.exe" --output build/acceptance/filezilla-windows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-msvc
          path: |
            build/m7/*.json
            build/acceptance/*
